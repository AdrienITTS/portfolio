intro: >-
  Je développe depuis 9 ans, surtout pour le retail (Leroy Merlin, ADEO, Norauto) et pour du SaaS.
  Je prends en charge un produit en entier : je cadre le besoin avec le métier, je conçois
  l'architecture, je code le front et le back, puis je suis la mise en production et le monitoring.
  Aujourd'hui je cherche un poste de Lead Developer, pour concevoir, accompagner une équipe et
  tenir la qualité de ce qu'elle livre.

