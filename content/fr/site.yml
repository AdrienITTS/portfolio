strengths:
  - title: Résoudre des problèmes métier
    text: >-
      Pour moi, l'informatique est d'abord un outil au service du métier. J'aime suivre un problème
      de bout en bout : en parler avec les utilisateurs, recueillir le besoin, concevoir la solution,
      puis la construire et la faire vivre en production.
    steps:
      [
        Échanges et besoin,
        Conception,
        Architecture,
        Back et front,
        Ops et CI/CD,
        Industrialisation,
        Monitoring,
      ]
  - title: Craft et pragmatisme
    text: >-
      Je suis attaché au software craftsmanship, au clean code et à l'esprit Pragmatic Programmer.
      J'essaie de faire le moins de choses possible, le plus proprement possible, pour obtenir le plus
      de résultat. J'applique ces principes au cas par cas, sans en faire des dogmes.
  - title: Faire grandir l'équipe
    text: >-
      Je partage ce que je sais : documentation, pair programming, revues bienveillantes, onboarding
      soigné. Mon but est que l'équipe livre bien même quand je ne suis pas là.
  - title: Décider sur des faits
    text: >-
      Face à un choix technique, je compare quelques options sur des critères explicites : besoin,
      coût de maintenance, réversibilité. Si on hésite, un POC court tranche, et la décision est
      notée dans un ADR.

