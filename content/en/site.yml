intro: >-
  I've been building software for 9 years, mostly for retail (Leroy Merlin, ADEO, Norauto) and SaaS.
  I take a product all the way: I work out the need with the business, design the architecture,
  write the front end and the back end, then look after the release and the monitoring.
  I'm now looking for a Lead Developer role: designing systems, supporting a team and keeping the
  quality of its work high.

