strengths:
  - title: Solving business problems
    text: >-
      To me, software is first a tool for the business. I like to follow a problem from start to
      finish: talk it through with users, gather the need, design the solution, then build it and
      keep it running in production.
    steps:
      [
        Talks and needs,
        Design,
        Architecture,
        Back and front end,
        Ops and CI/CD,
        Industrialisation,
        Monitoring,
      ]
  - title: Craft and pragmatism
    text: >-
      I care about software craftsmanship, clean code and the Pragmatic Programmer mindset. I try to
      do as little as possible, as cleanly as possible, for the most result. I apply these principles
      case by case, not as dogma.
  - title: Growing the team
    text: >-
      I share what I know: documentation, pair programming, kind code reviews, careful onboarding. The
      goal is a team that ships well even when I'm not around.
  - title: Deciding on facts
    text: >-
      When facing a technical choice, I compare a few options against explicit criteria: need,
      maintenance cost, reversibility. If we're still unsure, a short POC settles it, and the decision
      goes into an ADR.

